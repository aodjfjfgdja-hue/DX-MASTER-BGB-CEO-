<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>DX MASTER VPN KING</title>
<style>
:root{--c1:#ff1744;--c2:#00b0ff;--bg:#05060f;--card:#0d1024}
body.t2{--c1:#00e676;--c2:#00e5ff;--bg:#02100a;--card:#06201a}
body.t3{--c1:#d500f9;--c2:#ff4081;--bg:#0d0215;--card:#1a0626}
body.t4{--c1:#ffd600;--c2:#ff6d00;--bg:#120c00;--card:#221800}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:#fff;font-family:Arial,sans-serif;padding:14px;min-height:100vh}
.title{text-align:center;font-size:24px;font-weight:900;letter-spacing:2px;
 background:linear-gradient(90deg,var(--c1),var(--c2),var(--c1));background-size:200% 100%;
 -webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 3s linear infinite}
@keyframes flow{to{background-position:200% 0}}
.sub{text-align:center;font-size:12px;letter-spacing:3px;margin:4px 0 14px;color:var(--c2);animation:blinkT 1.2s infinite}
@keyframes blinkT{50%{opacity:.35}}
@keyframes blink{0%,100%{box-shadow:0 0 6px var(--c1),inset 0 0 6px var(--c1)}50%{box-shadow:0 0 14px var(--c2),inset 0 0 10px var(--c2)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.micwrap{text-align:center;margin-bottom:14px}
#mic{width:140px;height:140px;border-radius:50%;border:4px solid var(--c2);font-size:56px;color:#fff;
 background:radial-gradient(circle,#333,#111);animation:blink 1.4s infinite}
body.on #mic{background:radial-gradient(circle,var(--c1),#220010);animation:blink .7s infinite,pulse .7s infinite}
#st{margin-top:8px;font-weight:bold;letter-spacing:2px;color:var(--c1)}
.meter{height:10px;background:#222;border-radius:6px;margin:10px auto;max-width:320px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#00e676,#ffd600,#ff1744)}
details{background:var(--card);border:1px solid var(--c1);border-radius:12px;margin-bottom:10px;padding:10px;animation:blink 2s infinite}
summary{font-weight:bold;font-size:15px;color:var(--c2);list-style:none;cursor:pointer}
.row{margin-top:10px}
.row label{font-size:13px;display:flex;justify-content:space-between}
.row b{color:var(--c1)}
.ctl{display:flex;gap:8px;align-items:center;margin-top:4px}
.ctl input{flex:1;accent-color:var(--c1)}
.ctl button,.btn{background:linear-gradient(135deg,var(--c1),var(--c2));border:0;color:#fff;font-weight:bold;
 border-radius:10px;padding:8px 14px;font-size:16px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn.act{outline:3px solid #fff}
.sw{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:14px}
.sw input{width:22px;height:22px;accent-color:var(--c1)}
.brand{margin:16px 0 6px;text-align:center;font-size:20px;font-weight:900;letter-spacing:3px;
 padding:10px;border-radius:12px;border:2px solid var(--c2);animation:blink 1s infinite}
.warn{font-size:11px;color:#aaa;text-align:center;margin-top:6px}
</style>
</head>
<body>

<div class="title">DX MASTER BGB CEO</div>
<div class="sub">⚡ VOLUME BOOSTER MIC ⚡</div>

<div class="micwrap">
  <button id="mic" onclick="toggleMic()">🎤</button>
  <div id="st">MIC OFF</div>
  <div class="meter"><i id="lv"></i></div>
</div>

<details open><summary>🔊 ভলিউম / বুস্টার</summary><div id="p1"></div></details>
<details><summary>🔁 ইকো সাউন্ড</summary><div id="p2"></div></details>
<details><summary>🎚️ বেস / ট্রেবল</summary><div id="p3"></div></details>
<details><summary>🎭 ভয়েস ইফেক্ট</summary><div class="btns" id="p4"></div></details>
<details open><summary>🎧 নিজের সাউন্ড / কল</summary><div id="p5"></div></details>
<details><summary>🎨 থিম</summary><div class="btns" id="p6"></div></details>

<div class="brand">DX MASTER BGB CEO</div>
<div class="warn">⚠️ বেশি বুস্টে হেডফোন ব্যবহার করুন, কানের ক্ষতি হতে পারে</div>

<script>
var vals = {};
var ctx = null, N = null, stream = null, pitchRatio = 1, selfHear = true, raf = 0;

function applyAll() {
  if (!N) return;
  var t = ctx.currentTime;
  N.boost.gain.setTargetAtTime(vals.boost / 100, t, 0.02);
  N.master.gain.setTargetAtTime(vals.master / 100, t, 0.02);
  N.bass.gain.value = vals.bass;
  N.treble.gain.value = vals.treble;
  N.delay.delayTime.value = vals.edelay / 1000;
  N.fb.gain.value = vals.efb / 100;
  N.wet.gain.value = vals.echo / 100;
  N.mon.gain.setTargetAtTime(selfHear ? vals.mon / 100 : 0, t, 0.02);
}

function mk(p, id, label, min, max, step, val, unit, bs) {
  var d = document.createElement('div');
  d.className = 'row';
  d.innerHTML = '<label>' + label + ' <b></b></label><div class="ctl"><button>−</button>' +
    '<input type="range" min="' + min + '" max="' + max + '" step="' + step + '"><button>+</button></div>';
  document.getElementById(p).appendChild(d);
  var bt = d.querySelectorAll('button'), r = d.querySelector('input'), vb = d.querySelector('b');
  function set(v) {
    v = Math.max(min, Math.min(max, +v));
    r.value = v; vals[id] = v; vb.textContent = v + unit;
    applyAll();
  }
  r.oninput = function () { set(r.value); };
  bt[0].onclick = function () { set(vals[id] - bs); };
  bt[1].onclick = function () { set(vals[id] + bs); };
  set(val);
}

mk('p1', 'boost', '🔊 Volume Boost', 0, 70000, 100, 3000, '%', 500);
mk('p1', 'master', '📢 Master Volume', 0, 300, 5, 100, '%', 10);
mk('p2', 'echo', '🔁 Echo Level', 0, 100, 1, 30, '%', 5);
mk('p2', 'edelay', '⏱️ Echo Delay', 50, 1500, 10, 250, 'ms', 50);
mk('p2', 'efb', '♾️ Echo Repeat', 0, 90, 1, 35, '%', 5);
mk('p3', 'bass', '🥁 Bass', -20, 20, 1, 0, 'dB', 2);
mk('p3', 'treble', '🎼 Treble', -20, 20, 1, 0, 'dB', 2);
mk('p5', 'mon', '👂 Self Hearing Volume', 0, 300, 5, 100, '%', 10);

// Self hearing & call switches
(function () {
  var box = document.getElementById('p5');
  var s1 = document.createElement('div');
  s1.className = 'sw';
  s1.innerHTML = '<span>👂 নিজের সাউন্ড শোনা (Self Hearing)</span><input type="checkbox" checked>';
  s1.querySelector('input').onchange = function () { selfHear = this.checked; applyAll(); };
  box.appendChild(s1);

  var s2 = document.createElement('div');
  s2.className = 'sw';
  s2.innerHTML = '<span>📞 Call Allow / Call Mode (স্পিকার)</span><input type="checkbox">';
  s2.querySelector('input').onchange = function () {
    if (window.Android) Android.callMode(this.checked);
  };
  box.appendChild(s2);

  var b = document.createElement('div');
  b.className = 'btns';
  b.innerHTML = '<button class="btn">✈️ Telegram খুলুন</button>';
  b.querySelector('button').onclick = function () {
    if (window.Android) Android.openTelegram(); else window.open('https://t.me');
  };
  box.appendChild(b);
})();

// Voice effects
var effects = {
  'Normal': { p: 1, r: 0 },
  '👧 Girl': { p: 1.5, r: 0 },
  '🧒 Child': { p: 1.8, r: 0 },
  '👨 Deep': { p: 0.75, r: 0 },
  '🤖 Robot': { p: 1, r: 50 },
  '👽 Alien': { p: 1.2, r: 200 }
};
var curEffect = 'Normal';

function setEffect(name) {
  curEffect = name;
  var E = effects[name];
  pitchRatio = E.p;
  if (N) {
    if (E.r) {
      N.ring.gain.value = 0;
      N.osc.frequency.value = E.r;
      N.osc.connect(N.ring.gain);
    } else {
      try { N.osc.disconnect(); } catch (e) {}
      N.ring.gain.value = 1;
    }
  }
  var bs = document.querySelectorAll('#p4 .btn');
  for (var i = 0; i < bs.length; i++) {
    bs[i].classList.toggle('act', bs[i].textContent === name);
  }
}

(function () {
  var box = document.getElementById('p4');
  Object.keys(effects).forEach(function (n) {
    var b = document.createElement('button');
    b.className = 'btn';
    b.textContent = n;
    b.onclick = function () { setEffect(n); };
    box.appendChild(b);
  });
  setEffect('Normal');
})();

// Themes
(function () {
  var box = document.getElementById('p6');
  [['🔴🔵 Neon', ''], ['🟢 Green', 't2'], ['🟣 Purple', 't3'], ['🟡 Gold', 't4']].forEach(function (t) {
    var b = document.createElement('button');
    b.className = 'btn';
    b.textContent = t[0];
    b.onclick = function () {
      document.body.className = t[1] + (N ? ' on' : '');
      document.body.dataset.theme = t[1];
    };
    box.appendChild(b);
  });
})();

// Pitch shifter
function makePitch(c) {
  var sp = c.createScriptProcessor(2048, 1, 1);
  var SZ = 32768, W = 2048, buf = new Float32Array(SZ), w = 0, ph = 0;
  function rd(d) {
    var p = w - d;
    if (p < 0) p += SZ;
    var a = Math.floor(p), f = p - a;
    return buf[a % SZ] * (1 - f) + buf[(a + 1) % SZ] * f;
  }
  function g(p) { var s = Math.sin(Math.PI * p); return s * s; }
  sp.onaudioprocess = function (e) {
    var inp = e.inputBuffer.getChannelData(0);
    var out = e.outputBuffer.getChannelData(0);
    var r = pitchRatio;
    for (var n = 0; n < inp.length; n++) {
      buf[w] = inp[n];
      if (r !== 1) {
        ph += (1 - r) / W;
        ph -= Math.floor(ph);
        var p2 = (ph + 0.5) % 1;
        out[n] = rd(ph * W) * g(ph) + rd(p2 * W) * g(p2);
      } else {
        out[n] = inp[n];
      }
      w = (w + 1) % SZ;
    }
  };
  return sp;
}

async function start() {
  try {
    ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    if (ctx.state === 'suspended') await ctx.resume();

    var n = {};
    n.src = ctx.createMediaStreamSource(stream);
    n.bass = ctx.createBiquadFilter(); n.bass.type = 'lowshelf'; n.bass.frequency.value = 200;
    n.treble = ctx.createBiquadFilter(); n.treble.type = 'highshelf'; n.treble.frequency.value = 3000;
    n.pitch = makePitch(ctx);
    n.ring = ctx.createGain();
    n.osc = ctx.createOscillator(); n.osc.type = 'sine'; n.osc.start();
    n.boost = ctx.createGain();
    n.comp = ctx.createDynamicsCompressor();
    n.comp.threshold.value = -12; n.comp.knee.value = 0; n.comp.ratio.value = 20;
    n.comp.attack.value = 0.003; n.comp.release.value = 0.1;
    n.mix = ctx.createGain();
    n.delay = ctx.createDelay(2);
    n.fb = ctx.createGain();
    n.wet = ctx.createGain();
    n.master = ctx.createGain();
    n.an = ctx.createAnalyser(); n.an.fftSize = 256;
    n.mon = ctx.createGain();

    n.src.connect(n.bass);
    n.bass.connect(n.treble);
    n.treble.connect(n.pitch);
    n.pitch.connect(n.ring);
    n.ring.connect(n.boost);
    n.boost.connect(n.comp);
    n.comp.connect(n.mix);
    n.mix.connect(n.master);
    n.mix.connect(n.delay);
    n.delay.connect(n.wet);
    n.delay.connect(n.fb);
    n.fb.connect(n.delay);
    n.wet.connect(n.master);
    n.master.connect(n.an);
    n.an.connect(n.mon);
    n.mon.connect(ctx.destination);

    N = n;
    applyAll();
    setEffect(curEffect);
    setOn(true);
    meter();
  } catch (e) {
    alert('মাইক চালু হয়নি: ' + e.message);
    cleanup();
    setOn(false);
  }
}

function cleanup() {
  cancelAnimationFrame(raf);
  if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
  if (ctx) { try { ctx.close(); } catch (e) {} }
  N = null; ctx = null; stream = null;
  document.getElementById('lv').style.width = '0';
}

function stop() {
  cleanup();
  setOn(false);
}

function setOn(on) {
  document.body.classList.toggle('on', on);
  document.getElementById('st').textContent = on ? 'MIC ON 🔥' : 'MIC OFF';
  if (window.Android) Android.micState(on);
}

function meter() {
  if (!N) return;
  var d = new Uint8Array(N.an.frequencyBinCount);
  N.an.getByteTimeDomainData(d);
  var peak = 0;
  for (var i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i] - 128));
  document.getElementById('lv').style.width = Math.min(100, peak / 128 * 100) + '%';
  raf = requestAnimationFrame(meter);
}

function toggleMic() {
  if (N) stop(); else start();
}
window.toggleMic = toggleMic;
</script>
</body>
</html>
