name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
      - name: Make icon (DX MASTER VPN KING)
        run: |
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          convert -size 192x192 gradient:'#ff1744-#00b0ff' -gravity center -fill white -pointsize 26 -annotate 0 'DX MASTER\nVPN KING' app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DX-MASTER-APK
          path: app/build/outputs/apk/debug/app-debug.apk
